<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Box - Painel de Administração</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto space-y-6">

    <!-- Cabeçalho -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-extrabold text-indigo-400">Game Box Admin</h1>
      <p class="text-sm text-slate-400">Gerenciador e Cadastrador de Jogos</p>
    </header>

    <!-- Área de Login -->
    <section id="auth-section" class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
      <h2 class="text-xl font-bold mb-2">Login do Criador</h2>
      <p class="text-slate-400 text-sm mb-4">Entre com sua conta Google para liberar o salvamento de novos jogos.</p>
      
      <div id="user-info" class="hidden mb-4 p-3 bg-slate-800/60 rounded border border-slate-700">
        <p class="text-xs text-slate-400">Conectado como:</p>
        <p id="user-email" class="font-semibold text-indigo-300"></p>
        <p class="text-xs text-slate-500 mt-1">UID: <span id="user-uid" class="font-mono text-slate-400"></span></p>
      </div>

      <button id="btn-login" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-6 rounded-lg transition-all shadow-md hover:shadow-indigo-500/20">
        Entrar com Google
      </button>
      <button id="btn-logout" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2 px-6 rounded-lg transition-all">
        Sair
      </button>
    </section>

    <!-- Formulário de Cadastro de Jogos -->
    <section id="game-form-section" class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg opacity-50 pointer-events-none transition-all">
      <h2 class="text-xl font-bold mb-4 text-indigo-300">Cadastrar Novo Jogo</h2>
      <form id="game-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Título do Jogo</label>
          <input type="text" id="game-title" required placeholder="Ex: Super Mario Web" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">URL da Imagem / Capa</label>
          <input type="url" id="game-image" required placeholder="https://exemplo.com/imagem.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">URL / Link do Jogo (iFrame)</label>
          <input type="url" id="game-url" required placeholder="https://exemplo.com/jogo" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Categoria</label>
          <select id="game-category" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
            <option value="Ação">Ação</option>
            <option value="Aventura">Aventura</option>
            <option value="Arcade">Arcade</option>
            <option value="Esportes">Esportes</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <button type="submit" id="btn-save" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg hover:shadow-emerald-500/20">
          Salvar Jogo no Banco de Dados
        </button>
      </form>
    </section>

    <!-- Lista de Jogos Salvos -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
      <h2 class="text-xl font-bold mb-4">Jogos Cadastrados no Banco</h2>
      <div id="games-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-slate-500 text-sm col-span-full">Carregando catálogo...</p>
      </div>
    </section>

  </div>

  <!-- Scripts do Firebase -->

    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas credenciais do Firebase
    const firebaseConfig = {

      storageBucket: "game-box-d5f7d.firebasestorage.app",

      measurementId: "G-038NNDBE9R"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Elementos do DOM
    const btnLogin = document.getElementById("btn-login");

    const userInfo = document.getElementById("user-info");
    const userEmail = document.getElementById("user-email");

    const formSection = document.getElementById("game-form-section");
    const gameForm = document.getElementById("game-form");
    const gamesList = document.getElementById("games-list");

    // Login com Google
    btnLogin.addEventListener("click", () => {
      signInWithPopup(auth, provider).catch(error => alert("Erro ao entrar: " + error.message));
    });

    // Logout
    btnLogout.addEventListener("click", () => {
      signOut(auth);
    });

    // Monitorar estado da autenticação
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.textContent = user.email;
        userUid.textContent = user.uid;
        userInfo.classList.remove("hidden");
        btnLogin.classList.add("hidden");
        btnLogout.classList.remove("hidden");
        formSection.classList.remove("opacity-50", "pointer-events-none");
      } else {
        userInfo.classList.add("hidden");
        btnLogin.classList.remove("hidden");
        btnLogout.classList.add("hidden");
        formSection.classList.add("opacity-50", "pointer-events-none");
      }
    });

    // Salvar novo jogo no Firestore
